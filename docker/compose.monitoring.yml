services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influx-data:/var/lib/influxdb

  loki:
    image: grafana/loki:2.9.4
    user: "0"
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ../tools/monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
      - loki-wal:/wal

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "33000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ../tools/monitoring/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../tools/monitoring/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../tools/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki

  promtail:
    image: grafana/promtail:2.9.4
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../tools/monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - ../logs:/var/log/app:ro
      - promtail-positions:/var/lib/promtail
    depends_on:
      - loki

volumes:
  promtail-positions: {}
  loki-data: {}
  loki-wal: {}
  influx-data: {}


