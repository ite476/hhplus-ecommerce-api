spring:
  application:
    name: hhplus
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:23306/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
    username: application
    password: application
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.show_sql: true
  redis:
    host: localhost
    port: 6379
    password: redis_pwd

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "kr.hhplus.be.server.*"
        spring.json.value.default.type: "kr.hhplus.be.server.service.order.event.OrderCreated"
      group-id: hhplus-order-consumer
      auto-offset-reset: latest

# 성능 분석용 로깅 설정
logging:
  level:
    # QueryDSL 쿼리 생성 로그
    com.querydsl.sql: DEBUG
    com.querydsl.jpa: DEBUG
    # p6spy SQL 로깅
    p6spy: INFO
    # Hibernate SQL 로깅
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.orm.jdbc.bind: TRACE
    # 커넥션 풀 모니터링
    com.zaxxer.hikari: DEBUG
    # 트랜잭션 로깅
    org.springframework.transaction: DEBUG

app:
  idempotency:
    event-ttl-seconds: 86400
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs.yaml
  swagger-ui:
    enabled: true
decorator:
  datasource:
    p6spy:
      enable-logging: true